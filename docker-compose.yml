services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: on-failure

  db:
    image: postgres:18.6
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s